<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="무한매수법 차트 그림, 배경에 TQQQ">
  <!-- 배경 글자 -->
  <text x="160" y="118" text-anchor="middle" font-family="'Arial Black', Helvetica, Arial, sans-serif" font-weight="900" font-size="82" letter-spacing="2" fill="#4f5bd5" opacity=".14">TQQQ</text>
  <!-- 가이드선 -->
