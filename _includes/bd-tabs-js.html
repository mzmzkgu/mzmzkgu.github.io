<script>
(function () {
  // 탭 전환 (자바스크립트가 꺼져 있으면 모든 영역을 그냥 펼쳐서 보여 줌)
  var tabs = document.querySelectorAll('.bd-seg [data-t]');
  var panels = {}, def = 'posts';
  tabs.forEach(function (b) {
    var t = b.getAttribute('data-t');
    panels[t] = document.getElementById('bd-' + t);
    if (b.classList.contains('on')) def = t;
  });
  function show(t) {
    Object.keys(panels).forEach(function (k) { panels[k].hidden = k !== t; });
    tabs.forEach(function (b) {
      var on = b.getAttribute('data-t') === t;
      b.classList.toggle('on', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
  }
  tabs.forEach(function (b) {
    b.addEventListener('click', function () {
      var t = b.getAttribute('data-t');
      show(t);
      try { history.replaceState(null, '', '#' + t); } catch (e) {}
    });
  });
  var h = location.hash.replace('#', '');
  show(panels[h] ? h : def);
})();
</script>
