<script>
(function () {
  // 글 목록: 태그 필터 + 페이지 나누기 (자바스크립트가 꺼져 있으면 목록을 전부 그냥 보여 줌)
  var list = document.querySelector('.bd-list[data-paged]');
  if (!list) return;
  var per = parseInt(list.getAttribute('data-per'), 10) || 10;
  var items = [].slice.call(list.children).filter(function (li) { return li.hasAttribute('data-tags'); });
  var total = items.length, count = {};
  items.forEach(function (li) {
    li._tags = li.getAttribute('data-tags').split('|').filter(Boolean);
    li._tags.forEach(function (t) { count[t] = (count[t] || 0) + 1; });
  });
  // 모든 글에 붙은 태그는 걸러도 소용없으니 뺀다. 많이 쓴 태그 순서.
  var tags = Object.keys(count).filter(function (t) { return count[t] < total; })
    .sort(function (a, b) { return count[b] - count[a] || a.localeCompare(b, 'ko'); });
  // 처음엔 2번 이상 쓴 태그만(최대 10개) 보여 주고, 나머지는 '태그 더보기'로 연다
  var TOP = Math.min(10, tags.filter(function (t) { return count[t] >= 2; }).length) || Math.min(6, tags.length);
  var hasMore = tags.length > TOP;
  var state = { tag: '', page: 1, open: false };

  var bar = document.createElement('div'); bar.className = 'bd-chips';
  var status = document.createElement('p'); status.className = 'bd-status';
  var pager = document.createElement('nav'); pager.className = 'bd-pager'; pager.setAttribute('aria-label', '페이지');
  if (tags.length) list.parentNode.insertBefore(bar, list);
  list.parentNode.insertBefore(status, list);
  list.parentNode.appendChild(pager);

  function parseHash() {
    var h = location.hash.replace(/^#/, ''), o = { tag: '', page: 1 };
    h.split('&').forEach(function (kv) {
      var i = kv.indexOf('='); if (i < 0) return;
      var k = kv.slice(0, i), v = decodeURIComponent(kv.slice(i + 1));
      if (k === 'tag' && count[v]) o.tag = v;
      if (k === 'p') o.page = Math.max(1, parseInt(v, 10) || 1);
    });
    return o;
  }
  function saveHash() {
    var parts = [];
    if (state.tag) parts.push('tag=' + encodeURIComponent(state.tag));
    if (state.page > 1) parts.push('p=' + state.page);
    try { history.replaceState(null, '', location.pathname + location.search + (parts.length ? '#' + parts.join('&') : '')); } catch (e) {}
  }
  function chip(label, tag, extra) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'bd-chip' + (extra ? ' ' + extra : '');
    b.textContent = label; b.setAttribute('data-tag', tag);
    b.setAttribute('aria-pressed', state.tag === tag ? 'true' : 'false');
    if (state.tag === tag) b.classList.add('on');
    return b;
  }
  function drawChips() {
    bar.innerHTML = ''; bar.classList.toggle('open', state.open);
    bar.appendChild(chip('전체 ' + total, ''));
    var shown = state.open || !hasMore ? tags : tags.slice(0, TOP);
    // 선택한 태그가 접힌 목록에 없으면 같이 보여 준다
    if (state.tag && shown.indexOf(state.tag) < 0) shown = shown.concat([state.tag]);
    shown.forEach(function (t) { bar.appendChild(chip('#' + t + ' ' + count[t], t)); });
    if (hasMore) {
      var m = document.createElement('button');
      m.type = 'button'; m.className = 'bd-chip bd-more'; m.setAttribute('data-more', '1');
      m.textContent = state.open ? '접기' : '태그 더보기 +' + (tags.length - TOP);
      bar.appendChild(m);
    }
  }
  function drawPager(pages) {
    pager.innerHTML = '';
    if (pages <= 1) return;
    function btn(label, p, cls, aria) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'bd-pg' + (cls ? ' ' + cls : ''); b.textContent = label; b.setAttribute('data-p', p);
      if (aria) b.setAttribute('aria-label', aria);
      return b;
    }
    var prev = btn('‹', state.page - 1, 'nav', '이전 페이지'); prev.disabled = state.page <= 1; pager.appendChild(prev);
    for (var p = 1; p <= pages; p++) {
      var n = btn(String(p), p, p === state.page ? 'on' : '');
      if (p === state.page) n.setAttribute('aria-current', 'page');
      pager.appendChild(n);
    }
    var next = btn('›', state.page + 1, 'nav', '다음 페이지'); next.disabled = state.page >= pages; pager.appendChild(next);
  }
  function render(scroll) {
    var f = items.filter(function (li) { return !state.tag || li._tags.indexOf(state.tag) >= 0; });
    var pages = Math.max(1, Math.ceil(f.length / per));
    state.page = Math.min(state.page, pages);
    items.forEach(function (li) { li.hidden = true; });
    f.slice((state.page - 1) * per, state.page * per).forEach(function (li) { li.hidden = false; });
    status.textContent = state.tag ? '#' + state.tag + ' · ' + f.length + '개' : '';
    status.hidden = !state.tag;
    drawChips(); drawPager(pages); saveHash();
    if (scroll) { var h = document.querySelector('.bd-h-lg'); if (h && h.scrollIntoView) h.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  }
  bar.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.hasAttribute('data-more')) { state.open = !state.open; drawChips(); return; }
    var t = b.getAttribute('data-tag');
    state.tag = state.tag === t ? '' : t; state.page = 1; render(false);
  });
  pager.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || b.disabled) return;
    state.page = parseInt(b.getAttribute('data-p'), 10) || 1; render(true);
  });
  var init = parseHash(); state.tag = init.tag; state.page = init.page;
  render(false);
})();
</script>
