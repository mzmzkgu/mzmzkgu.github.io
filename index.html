<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>mzmzkgu — Projects</title>
<meta name="description" content="mzmzkgu의 사이드 프로젝트 모음입니다. 공모주 트래킹, 이미지 리사이즈, 배경 제거, 자동매매 관리 등 실사용 웹 도구를 한 곳에 모아둔 프로젝트 데스크톱입니다.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='5' fill='%230d0906'/><text x='12' y='16' font-family='monospace' font-size='11' fill='%23f7a83e' text-anchor='middle'>&gt;_</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --bg-1:#0d0906;
    --bg-2:#1a1108;
    --tile-bg:rgba(255,255,255,.035);
    --tile-border:rgba(247,183,110,.14);
    --tile-hover:rgba(247,168,62,.10);
    --accent:#f7a83e;
    --accent-soft:rgba(247,168,62,.35);
    --text-1:#f2e9dd;
    --text-2:#9a8b76;
    --taskbar-bg:rgba(10,7,4,.86);
    --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans:'Pretendard', -apple-system, 'Malgun Gothic', sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      radial-gradient(circle at 18% -8%, rgba(247,168,62,.09), transparent 42%),
      radial-gradient(circle at 100% 100%, rgba(247,168,62,.05), transparent 40%),
      radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%),
      linear-gradient(160deg, var(--bg-2), var(--bg-1) 60%);
    color:var(--text-1);
    font-family:var(--sans);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }
  /* CRT scanline texture — nods to old amber-phosphor SCADA/HMI monitors */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:repeating-linear-gradient(
      0deg,
      rgba(255,255,255,.035) 0px,
      rgba(255,255,255,.035) 1px,
      transparent 1px,
      transparent 3px
    );
    mask-image:radial-gradient(circle at 30% 15%, black, transparent 78%);
    pointer-events:none;
  }

  .desktop{
    position:relative;
    padding:52px 24px 130px;
    max-width:960px;
    margin:0 auto;
    min-height:100vh;
  }

  .prompt{
    font-family:var(--mono);
    font-size:.86rem;
    color:var(--text-2);
    margin:0 0 34px;
    letter-spacing:.01em;
  }
  .prompt .user{ color:var(--accent); }
  .prompt .cmd{ color:var(--text-1); }
  .prompt .cursor{
    display:inline-block;
    width:7px;
    height:14px;
    background:var(--accent);
    margin-left:2px;
    vertical-align:-2px;
    animation:blink 1s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  .icon-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, 108px);
    gap:26px 18px;
  }

  .icon-tile{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    padding:14px 8px 12px;
    border-radius:12px;
    border:1px solid transparent;
    text-decoration:none;
    color:var(--text-1);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:background .15s ease, border-color .15s ease, transform .1s ease;
  }
  .icon-tile:hover,
  .icon-tile:focus-visible{
    background:var(--tile-hover);
    border-color:var(--accent-soft);
  }
  .icon-tile:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  .icon-tile:active{ transform:scale(.96); }

  .icon-box{
    width:56px;
    height:56px;
    border-radius:14px;
    background:var(--tile-bg);
    border:1px solid var(--tile-border);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--accent);
  }
  .icon-tile:hover .icon-box,
  .icon-tile:focus-visible .icon-box{
    box-shadow:0 0 0 1px var(--accent-soft), 0 8px 20px -8px rgba(247,168,62,.4);
  }
  .icon-box svg{ width:28px; height:28px; }

  .label{
    font-size:.8rem;
    text-align:center;
    line-height:1.35;
    color:var(--text-1);
    word-break:keep-all;
  }
  .label .en{
    display:block;
    font-family:var(--mono);
    font-size:.65rem;
    color:var(--text-2);
    margin-top:2px;
  }

  /* Taskbar */
  .taskbar{
    position:fixed;
    left:0; right:0; bottom:0;
    height:52px;
    background:var(--taskbar-bg);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-top:1px solid rgba(247,183,110,.12);
    display:flex;
    align-items:center;
    padding:0 12px;
    gap:10px;
    z-index:20;
  }
  .start-btn{
    display:flex;
    align-items:center;
    gap:8px;
    background:transparent;
    border:1px solid transparent;
    border-radius:8px;
    padding:7px 12px;
    color:var(--text-1);
    font-family:var(--sans);
    font-size:.82rem;
    font-weight:600;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
  }
  .start-btn:hover,
  .start-btn[aria-expanded="true"]{
    background:rgba(247,168,62,.10);
    border-color:var(--accent-soft);
  }
  .start-btn svg{ width:16px; height:16px; color:var(--accent); }

  .taskbar-label{
    font-family:var(--mono);
    font-size:.74rem;
    color:var(--text-2);
    flex:1;
    text-align:center;
    letter-spacing:.02em;
  }

  .clock{
    font-family:var(--mono);
    font-size:.8rem;
    color:var(--text-1);
    padding:6px 10px;
    border-radius:8px;
    background:rgba(255,255,255,.03);
    border:1px solid rgba(247,183,110,.1);
    white-space:nowrap;
  }

  .start-panel{
    position:fixed;
    left:12px;
    bottom:64px;
    width:238px;
    background:var(--taskbar-bg);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(247,183,110,.14);
    border-radius:12px;
    padding:16px;
    box-shadow:0 20px 40px -12px rgba(0,0,0,.6);
    opacity:0;
    transform:translateY(6px);
    pointer-events:none;
    transition:opacity .15s ease, transform .15s ease;
    z-index:21;
  }
  .start-panel.open{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }
  .start-panel h2{
    margin:0 0 6px;
    font-size:.85rem;
    color:var(--accent);
    font-family:var(--mono);
  }
  .start-panel p{
    margin:0;
    font-size:.76rem;
    line-height:1.6;
    color:var(--text-2);
  }

  @media (max-width:520px){
    .desktop{ padding:36px 16px 118px; }
    .icon-grid{
      grid-template-columns:repeat(2, 1fr);
      justify-items:center;
      gap:22px 8px;
    }
    .taskbar-label{ display:none; }
  }

  @media (prefers-reduced-motion: reduce){
    .prompt .cursor{ animation:none; opacity:1; }
    .icon-tile, .start-btn, .start-panel{ transition:none; }
  }
</style>
</head>
<body>

  <div class="desktop">
    <p class="prompt">
      <span class="user">mzmzkgu@github.io</span>:~/projects$ <span class="cmd">ls -la</span><span class="cursor"></span>
    </p>

    <div class="icon-grid">

      <a class="icon-tile" href="/ipotracker">
        <span class="icon-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <line x1="6" y1="18" x2="6" y2="10"/>
            <line x1="12" y1="18" x2="12" y2="6"/>
            <line x1="18" y1="18" x2="18" y2="13"/>
            <path d="M4 9 L11 3 L15 6 L20 2"/>
            <path d="M16 2 h4 v4"/>
          </svg>
        </span>
        <span class="label">공모주 관리<span class="en">ipotracker</span></span>
      </a>

      <a class="icon-tile" href="/imgresize">
        <span class="icon-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="5" width="16" height="14" rx="2"/>
            <circle cx="9.5" cy="10" r="1.4"/>
            <path d="M5 16 L10 11 L13 14 L16 11 L19 15"/>
            <path d="M15 2 L18 2 L18 5"/>
            <path d="M6 22 L3 22 L3 19"/>
          </svg>
        </span>
        <span class="label">사진 리사이즈<span class="en">imgresize</span></span>
      </a>

      <a class="icon-tile" href="/bgremove">
        <span class="icon-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3.5" y="3.5" width="17" height="17" rx="2"/>
            <path d="M3.5 3.5h4v4h-4z" fill="currentColor" stroke="none" opacity=".18"/>
            <path d="M11.5 7.5h4v4h-4z" fill="currentColor" stroke="none" opacity=".18"/>
            <path d="M7.5 11.5h4v4h-4z" fill="currentColor" stroke="none" opacity=".18"/>
            <path d="M15.5 15.5h4v4h-4z" fill="currentColor" stroke="none" opacity=".18"/>
            <circle cx="12" cy="12" r="5" stroke-dasharray="2.5 2.5"/>
          </svg>
        </span>
        <span class="label">배경 투명화<span class="en">bgremove</span></span>
      </a>

      <a class="icon-tile" href="/infinityBuy">
        <span class="icon-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 9c-2 0-3.5 1.4-3.5 3s1.5 3 3.5 3c2.2 0 3.4-1.6 5-4.5S15.8 6 18 6c2 0 3.5 1.4 3.5 3s-1.5 3-3.5 3c-2.2 0-3.4-1.6-5-4.5"/>
          </svg>
        </span>
        <span class="label">무한매수 관리<span class="en">infinityBuy</span></span>
      </a>

    </div>
  </div>

  <div class="taskbar">
    <button class="start-btn" id="startBtn" type="button" aria-expanded="false" aria-controls="startPanel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="2.2"/>
        <path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/>
      </svg>
      mzmzkgu
    </button>
    <span class="taskbar-label">개인 프로젝트 데스크톱</span>
    <span class="clock" id="clock">--:--:--</span>
  </div>

  <div class="start-panel" id="startPanel" role="dialog" aria-label="소개">
    <h2>&gt;_ mzmzkgu</h2>
    <p>네트워크·보안 엔지니어의 사이드 프로젝트 아카이브. 필요할 때 쓰려고 만든 작은 웹 도구들을 모아둡니다.</p>
  </div>

<script>
  // 실시간 시계
  var clockEl = document.getElementById('clock');
  function tick(){
    var now = new Date();
    var hh = String(now.getHours()).padStart(2,'0');
    var mm = String(now.getMinutes()).padStart(2,'0');
    var ss = String(now.getSeconds()).padStart(2,'0');
    clockEl.textContent = hh + ':' + mm + ':' + ss;
  }
  tick();
  setInterval(tick, 1000);

  // 시작 메뉴 토글
  var startBtn = document.getElementById('startBtn');
  var startPanel = document.getElementById('startPanel');
  startBtn.addEventListener('click', function(e){
    e.stopPropagation();
    var open = startPanel.classList.toggle('open');
    startBtn.setAttribute('aria-expanded', open);
  });
  document.addEventListener('click', function(e){
    if(!startPanel.contains(e.target) && e.target !== startBtn){
      startPanel.classList.remove('open');
      startBtn.setAttribute('aria-expanded', 'false');
    }
  });
</script>

</body>
</html>
